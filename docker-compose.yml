version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: khet2kitchen-postgres
    restart: always
    environment:
      POSTGRES_USER: k2k_user
      POSTGRES_PASSWORD: k2k_password_secure
      POSTGRES_DB: khet2kitchen_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U k2k_user -d khet2kitchen_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
